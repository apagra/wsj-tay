<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13315c"/>
      <stop offset="1" stop-color="#050d1c"/>
    </linearGradient>
    <linearGradient id="one" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0d7fa8"/>
      <stop offset="1" stop-color="#4fdcff"/>
    </linearGradient>
    <linearGradient id="two" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b56500"/>
      <stop offset="1" stop-color="#ffc247"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="256" height="256" rx="52" fill="url(#bg)"/>

  <!-- faint spectrum behind the bars -->
  <g opacity="0.30" fill="#5ea9e6">
    <rect x="34"  y="150" width="5" height="46"/>
    <rect x="46"  y="132" width="5" height="64"/>
    <rect x="58"  y="163" width="5" height="33"/>
    <rect x="94"  y="141" width="5" height="55"/>
    <rect x="106" y="168" width="5" height="28"/>
    <rect x="118" y="126" width="5" height="70"/>
    <rect x="154" y="156" width="5" height="40"/>
    <rect x="166" y="137" width="5" height="59"/>
    <rect x="202" y="147" width="5" height="49"/>
    <rect x="214" y="170" width="5" height="26"/>
  </g>

  <!-- the two receivers -->
  <rect x="64"  y="58"  width="44" height="138" rx="14" fill="url(#one)"/>
  <rect x="148" y="92"  width="44" height="104" rx="14" fill="url(#two)"/>

  <!-- baseline -->
  <rect x="34" y="196" width="188" height="7" rx="3.5" fill="#2ee08a"/>

  <text x="128" y="234" text-anchor="middle"
        font-family="Segoe UI, DejaVu Sans, Arial, sans-serif"
        font-size="30" font-weight="700" letter-spacing="2.5"
        fill="#eaf4ff">SV1TAY</text>
</svg>
