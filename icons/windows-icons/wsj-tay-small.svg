<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#13315c"/>
      <stop offset="1" stop-color="#050d1c"/>
    </linearGradient>
    <linearGradient id="one" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#0d7fa8"/>
      <stop offset="1" stop-color="#4fdcff"/>
    </linearGradient>
    <linearGradient id="two" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#b56500"/>
      <stop offset="1" stop-color="#ffc247"/>
    </linearGradient>
  </defs>

  <!-- Small sizes drop the spectrum and the callsign: at 16 px they turn to
       mud and take contrast away from the only thing that has to read, which
       is two bars of different heights, side by side. -->
  <rect x="0" y="0" width="256" height="256" rx="52" fill="url(#bg)"/>

  <rect x="52"  y="46"  width="60" height="158" rx="18" fill="url(#one)"/>
  <rect x="144" y="94"  width="60" height="110" rx="18" fill="url(#two)"/>

  <rect x="30" y="206" width="196" height="12" rx="6" fill="#2ee08a"/>
</svg>
